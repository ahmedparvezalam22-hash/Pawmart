<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>PawMartFinder — Discover Products You'll Love</title>
    <meta name="description" content="Discover curated trending products for pets, fashion, tech, and everyday life. Explore cats, dogs, phone cases, stylish t-shirts, cozy hoodies, and top books on PawMartFinder." />

    <!-- Google Search Engine Optimization (SEO) & Robots -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <link rel="canonical" id="canonical-url-tag" href="https://pawmart.com/" />

    <!-- Apple iOS Safari & Home Screen Optimization -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PawMart" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#f59e0b" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Domain / Site Verification for Google Search Console, Meta, TikTok, Snapchat, Pinterest & Tumblr -->
    <meta name="google-site-verification" id="google-site-verification-tag" content="" />
    <meta name="facebook-domain-verification" id="meta-domain-tag" content="" />
    <meta name="tiktok-developers-site-verification" id="tiktok-verify-tag" content="" />
    <meta name="snapchat-site-verification" id="snap-verify-tag" content="" />
    <meta name="p:domain_verify" id="pinterest-verify-tag" content="" />
    <meta name="tumblr-site-verification" id="tumblr-verify-tag" content="" />

    <!-- Performance & Speed Optimization: Preconnect & DNS-Prefetch for Ads, Analytics & Amazon Images -->
    <link rel="preconnect" href="https://www.googletagmanager.com" crossorigin />
    <link rel="preconnect" href="https://www.google-analytics.com" crossorigin />
    <link rel="dns-prefetch" href="https://www.google-analytics.com" />
    <link rel="preconnect" href="https://m.media-amazon.com" crossorigin />
    <link rel="dns-prefetch" href="https://images-na.ssl-images-amazon.com" />
    <link rel="dns-prefetch" href="https://connect.facebook.net" />
    <link rel="dns-prefetch" href="https://analytics.tiktok.com" />
    <link rel="dns-prefetch" href="https://sc-static.net" />
    <link rel="preconnect" href="https://s.pinimg.com" crossorigin />
    <link rel="preconnect" href="https://ct.pinterest.com" crossorigin />
    <link rel="preconnect" href="https://a.quora.com" crossorigin />
    <link rel="preconnect" href="https://static.ads-twitter.com" crossorigin />
    <link rel="preconnect" href="https://googleads.g.doubleclick.net" crossorigin />
    <link rel="dns-prefetch" href="https://static.ads-twitter.com" />
    <link rel="dns-prefetch" href="https://www.youtube.com" />

    <!-- Open Graph for Facebook, Instagram, Threads, and WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PawMartFinder" />
    <meta property="og:title" content="PawMartFinder — Discover Products You'll Love" />
    <meta property="og:description" content="Discover curated trending products for pets, fashion, phone cases, and everyday lifestyle essentials on PawMartFinder." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1548767797-d8c844163c4c?w=1200&auto=format&fit=crop&q=80" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="PawMartFinder Discover Products" />

    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@PawMartFinder" />
    <meta name="twitter:title" content="PawMartFinder — Discover Products You'll Love" />
    <meta name="twitter:description" content="Discover curated trending products for pets, fashion, phone cases, and everyday lifestyle essentials." />
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1548767797-d8c844163c4c?w=1200&auto=format&fit=crop&q=80" />

    <!-- Structured Data JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "PawMartFinder",
      "alternateName": ["PawMart Finder", "PawMart"],
      "description": "Discover curated trending products for pets, fashion, phone cases, tech, and everyday life.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
